document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Fp>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"sobre-mi\" style=\"padding:80px 0 110px\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:0 32px; display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:64px; align-items:center\">\n      <div data-reveal=\"\" style=\"position:relative; min-height:520px; background:repeating-linear-gradient(135deg, #EAD7D2 0 12px, #F1E1DD 12px 24px); display:flex; align-items:center; justify-content:center\">\n        <div style=\"position:absolute; inset:20px; border:1px solid rgba(107,30,46,0.18)\"><\u002Fdiv>\n        <p style=\"position:relative; margin:0; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#6B1E2E; background:#F9F3F1; padding:10px 16px\">\n          retrato marcela — 1000×1200\n        <\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\">\n        <p style=\"margin:0 0 18px; font-size:11.5px; letter-spacing:0.26em; text-transform:uppercase; color:#B46464\">Sobre mí<\u002Fp>\n        <h2 style=\"margin:0 0 28px; font-family:'DM Serif Display',serif; font-weight:400; font-size:clamp(30px, 3.4vw, 44px); line-height:1.15; letter-spacing:-1px; color:#6B1E2E\">\n          Hola, soy Marcela Leites.\n        <\u002Fh2>\n        <p style=\"margin:0 0 18px; font-size:16px; line-height:1.75; color:#4A4A4A; max-width:52ch\">\n          Soy abogada y me especializo en Derecho Civil (Familia y Sucesiones), Derecho Laboral y Derecho del Consumidor.\n        <\u002Fp>\n        <p style=\"margin:0 0 34px; font-size:16px; line-height:1.75; color:#4A4A4A; max-width:52ch\">\n          Mi trabajo no termina en el trámite: empieza cuando entendés qué está pasando y qué caminos tenés. Te explico las opciones en palabras simples, con sus tiempos y sus costos, para que la decisión sea tuya y esté bien tomada.\n        <\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:1px; background:rgba(107,30,46,0.14); border-top:1px solid rgba(107,30,46,0.14); border-bottom:1px solid rgba(107,30,46,0.14)\">\n          <sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"background:#F9F3F1; padding:26px 20px\">\n              <p style=\"margin:0 0 8px; font-family:'DM Serif Display',serif; font-size:22px; color:#B46464\">{{ p.num }}<\u002Fp>\n              <p style=\"margin:0; font-size:14px; line-height:1.6; color:#4A4A4A\">{{ p.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#EAD7D2; padding:100px 0\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:0 32px\">\n      <div data-reveal=\"\" style=\"max-width:640px; margin-bottom:56px\">\n        <p style=\"margin:0 0 18px; font-size:11.5px; letter-spacing:0.26em; text-transform:uppercase; color:#6B1E2E\">Quizás te está pasando esto<\u002Fp>\n        <h2 style=\"margin:0; font-family:'DM Serif Display',serif; font-weight:400; font-size:clamp(30px, 3.4vw, 44px); line-height:1.15; letter-spacing:-1px; color:#6B1E2E\">\n          Si algo de esto te suena, hay una salida.\n        <\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:0 56px\">\n        <sc-for list=\"{{ problems }}\" as=\"q\" hint-placeholder-count=\"6\">\n          <div data-reveal=\"\" style=\"display:flex; gap:18px; padding:24px 0; border-bottom:1px solid rgba(107,30,46,0.22)\">\n            <span style=\"font-family:'DM Serif Display',serif; font-size:16px; color:#B46464; line-height:1.6; flex:0 0 auto\">{{ q.n }}<\u002Fspan>\n            <p style=\"margin:0; font-size:16.5px; line-height:1.6; color:#6B1E2E; font-weight:500\">{{ q.text }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p data-reveal=\"\" style=\"margin:48px 0 0; font-family:'DM Serif Display',serif; font-style:italic; font-size:22px; line-height:1.5; color:#6B1E2E; max-width:60ch\">\n        Una primera conversación suele ordenar más de lo que imaginás.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"proceso\" style=\"padding:110px 0\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:0 32px\">\n      <div data-reveal=\"\" style=\"text-align:center; max-width:700px; margin:0 auto 64px\">\n        <p style=\"margin:0 0 18px; font-size:11.5px; letter-spacing:0.26em; text-transform:uppercase; color:#B46464\">¿Cómo trabajo?<\u002Fp>\n        <h2 style=\"margin:0; font-family:'DM Serif Display',serif; font-weight:400; font-size:clamp(30px, 3.4vw, 46px); line-height:1.15; letter-spacing:-1px; color:#6B1E2E\">\n          Un proceso simple y claro.\n        <\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:1px; background:rgba(107,30,46,0.14); border:1px solid rgba(107,30,46,0.14)\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div data-reveal=\"\" style=\"background:#F9F3F1; padding:40px 30px; transition:background .35s ease\" style-hover=\"background:#FFFFFF\">\n            <span style=\"display:inline-flex; align-items:center; justify-content:center; width:46px; height:46px; border:1px solid #B46464; border-radius:50%; font-family:'DM Serif Display',serif; font-size:20px; color:#6B1E2E; margin-bottom:22px\">{{ s.n }}<\u002Fspan>\n            <h3 style=\"margin:0 0 12px; font-family:'DM Serif Display',serif; font-weight:400; font-size:22px; line-height:1.25; color:#6B1E2E\">{{ s.title }}<\u002Fh3>\n            <p style=\"margin:0; font-size:14.5px; line-height:1.7; color:#4A4A4A\">{{ s.text }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#F1E5E2; padding:100px 0\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:0 32px; display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:56px; align-items:center\">\n      <div data-reveal=\"\">\n        <p style=\"margin:0 0 18px; font-size:11.5px; letter-spacing:0.26em; text-transform:uppercase; color:#B46464\">Cercanía humana<\u002Fp>\n        <h2 style=\"margin:0 0 26px; font-family:'DM Serif Display',serif; font-weight:400; font-size:clamp(28px, 3.2vw, 42px); line-height:1.18; letter-spacing:-1px; color:#6B1E2E\">\n          Detrás de cada expediente hay una persona.\n        <\u002Fh2>\n        <p style=\"margin:0 0 18px; font-size:16px; line-height:1.75; color:#4A4A4A; max-width:52ch\">\n          Los temas de familia, trabajo o consumo llegan en momentos difíciles. Por eso cuido cómo te explico las cosas, respondo tus dudas cuantas veces haga falta y te digo también lo que no conviene hacer.\n        <\u002Fp>\n        <ul style=\"margin:0; padding:0; list-style:none; display:grid; gap:14px; max-width:46ch\">\n          <sc-for list=\"{{ care }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <li style=\"display:flex; gap:14px; align-items:flex-start; font-size:15.5px; line-height:1.6; color:#4A4A4A\">\n              <span style=\"display:block; width:18px; height:1px; background:#B46464; margin-top:12px; flex:0 0 auto\"><\u002Fspan>\n              {{ c }}\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"position:relative; min-height:420px; background:repeating-linear-gradient(135deg, #EAD7D2 0 12px, #F6EAE7 12px 24px); display:flex; align-items:center; justify-content:center\">\n        <div style=\"position:absolute; inset:20px; border:1px solid rgba(107,30,46,0.18)\"><\u002Fdiv>\n        <p style=\"position:relative; margin:0; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#6B1E2E; background:#F9F3F1; padding:10px 16px\">\n          foto consulta / detalle cálido — 1100×900\n        <\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"preguntas\" style=\"padding:110px 0\">\n    <div style=\"max-width:1000px; margin:0 auto; padding:0 32px\">\n      <div data-reveal=\"\" style=\"margin-bottom:52px; max-width:620px\">\n        <p style=\"margin:0 0 18px; font-size:11.5px; letter-spacing:0.26em; text-transform:uppercase; color:#B46464\">Preguntas frecuentes<\u002Fp>\n        <h2 style=\"margin:0; font-family:'DM Serif Display',serif; font-weight:400; font-size:clamp(30px, 3.4vw, 44px); line-height:1.15; letter-spacing:-1px; color:#6B1E2E\">\n          Lo que suelen preguntarme.\n        <\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(107,30,46,0.16)\">\n        <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <div data-reveal=\"\" style=\"border-bottom:1px solid rgba(107,30,46,0.16)\">\n            <button type=\"button\" sc-camel-on-click=\"{{ f.toggle }}\" style=\"width:100%; display:flex; align-items:center; gap:24px; background:transparent; border:0; padding:28px 4px; cursor:pointer; text-align:left; font-family:Manrope, sans-serif; transition:padding-left .3s ease\" style-hover=\"padding-left:12px\">\n              <span style=\"flex:1 1 auto; font-size:17.5px; font-weight:500; line-height:1.45; color:#6B1E2E\">{{ f.q }}<\u002Fspan>\n              <span style=\"position:relative; width:20px; height:20px; flex:0 0 auto\">\n                <span style=\"position:absolute; top:50%; left:0; width:20px; height:1px; background:#B46464\"><\u002Fspan>\n                <span ref=\"{{ f.iconRef }}\" style=\"position:absolute; top:50%; left:0; width:20px; height:1px; background:#B46464; transform:rotate(90deg); transition:transform .3s ease\"><\u002Fspan>\n              <\u002Fspan>\n            <\u002Fbutton> e-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:32px\">\n        <p style=\"margin:0; font-size:14px; line-height:1.65; color:#EAD7D2\">\n          <span style=\"display:block; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(249,243,241,0.6); margin-bottom:6px\">Atención<\u002Fspan>\n          CABA y Provincia de Buenos Aires<br>San Martín · Quilmes · La Matanza\n        <\u002Fp>\n        <p style=\"margin:0; font-size:14px; line-height:1.65; color:#EAD7D2\">\n          <span style=\"display:block; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(249,243,241,0.6); margin-bottom:6px\">Modalidad<\u002Fspan>\n          Consultas presenciales y virtuales, con turno previo.\n        <\u002Fp>\n        <p style=\"margin:0; font-size:14px; line-height:1.65; color:#EAD7D2\">\n          <span style=\"display:block; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(249,243,241,0.6); margin-bottom:6px\">Respuesta<\u002Fspan>\n          Lunes a viernes, dentro del día hábil.\n        <\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#EAD7D2; padding:90px 0\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:0 32px; display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:48px; align-items:center\">\n      <blockquote data-reveal=\"\" style=\"margin:0\">\n        <p style=\"margin:0; font-family:'DM Serif Display',serif; font-style:italic; font-weight:400; font-size:clamp(26px, 3vw, 38px); line-height:1.3; color:#6B1E2E; max-width:24ch\">\n          “Entender tu situación es el primer paso para resolverla.”\n        <\u002Fp>\n      <\u002Fblockquote>\n      <div data-reveal=\"\" style=\"display:flex; flex-direction:column; align-items:flex-start; gap:16px\">\n        <a href=\"{{ waHref }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex; align-items:center; gap:14px; background:#6B1E2E; color:#F9F3F1; font-size:12.5px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; padding:18px 32px; transition:background .3s ease, transform .3s ease\" style-hover=\"background:#B46464; transform:translateY(-2px); color:#F9F3F1\">\n          <span style=\"display:inline-block; width:18px; height:18px; border:1px solid rgba(249,243,241,0.7); border-radius:50%\"><\u002Fspan>\n          Escribime hoy\n        <\u002Fa>\n        <p style=\"margin:0; font-size:14px; color:#4A4A4A\">Estoy para acompañarte.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#F9F3F1; border-top:1px solid rgba(107,30,46,0.14); padding:56px 0 34px\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:0 32px\">\n      <div style=\"display:flex; flex-wrap:wrap; gap:32px; align-items:center; justify-content:space-between; padding-bottom:34px; border-bottom:1px solid rgba(107,30,46,0.12)\">\n        <img src=\"e9790dd0-c85a-431d-837f-c95e05bb2f5b\" alt=\"Marcela Leites — Abogada\" style=\"display:block; height:52px; width:auto\">\n        <nav style=\"display:flex; flex-wrap:wrap; gap:24px\">\n          <a href=\"#inicio\" style=\"font-size:13px; color:#4A4A4A\" style-hover=\"color:#6B1E2E\">Inicio<\u002Fa>\n          <a href=\"#sobre-mi\" style=\"font-size:13px; color:#4A4A4A\" style-hover=\"color:#6B1E2E\">Sobre mí<\u002Fa>\n          <a href=\"#areas\" style=\"font-size:13px; color:#4A4A4A\" style-hover=\"color:#6B1E2E\">Áreas de práctica<\u002Fa>\n          <a href=\"#proceso\" style=\"font-size:13px; color:#4A4A4A\" style-hover=\"color:#6B1E2E\">Cómo trabajo<\u002Fa>\n          <a href=\"#preguntas\" style=\"font-size:13px; color:#4A4A4A\" style-hover=\"color:#6B1E2E\">Preguntas<\u002Fa>\n          <a href=\"#contacto\" style=\"font-size:13px; color:#4A4A4A\" style-hover=\"color:#6B1E2E\">Contacto<\u002Fa>\n          <a href=\"legales.html\" style=\"font-size:13px; color:#4A4A4A\" style-hover=\"color:#6B1E2E\">Aviso legal<\u002Fa>\n        <\u002Fnav>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:18px; justify-content:space-between; padding-top:26px\">\n        <p style=\"margin:0; font-size:12px; color:#4A4A4A\">© 2026 Marcela Leites. Todos los derechos reservados.<\u002Fp>\n        <p style=\"margin:0; font-size:12px; color:#4A4A4A\">\n          Diseño y desarrollo: <a href=\"#\" style=\"color:#6B1E2E; border-bottom:1px solid rgba(107,30,46,0.3)\" style-hover=\"color:#B46464\">Switch Gestión<\u002Fa>\n        <\u002Fp>\n        <p style=\"margin:0; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:#B46464\">Derecho para una vida real<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n]]&gt;\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;whatsappNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5491100000000&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contacto&quot;},&quot;revealOnScroll&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Interacción&quot;}}\">\nclass Component extends DCLogic {\n  _open = -1;\n\n  paintFaq() {\n    (this._refs || []).forEach((r, i) => {\n      const panel = r.panel.current;\n      if (!panel) return;\n      const open = this._open === i;\n      panel.style.maxHeight = open ? panel.scrollHeight + 40 + 'px' : '0px';\n      panel.style.opacity = open ? '1' : '0';\n      const btn = panel.previousElementSibling;\n      const strokes = btn ? btn.querySelectorAll('span > span') : [];\n      const icon = strokes[strokes.length - 1];\n      if (icon) icon.style.transform = open ? 'rotate(0deg)' : 'rotate(90deg)';\n    });\n  }\n\n  componentDidMount() {\n    this.paintFaq();\n    const root = this.el || document;\n    const header = document.getElementById('ml-header');\n    this._onScroll = () => {\n      if (!header) return;\n      const s = window.scrollY > 24;\n      header.style.padding = s ? '12px 0' : '20px 0';\n      header.style.boxShadow = s ? '0 1px 24px rgba(107,30,46,0.10)' : 'none';\n      header.style.background = s ? 'rgba(249,243,241,0.97)' : 'rgba(249,243,241,0.92)';\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n\n    if (this.props.revealOnScroll === false) return;\n    const items = Array.from(document.querySelectorAll('[data-reveal]'));\n    items.forEach((el) => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(20px)';\n      el.style.transition = 'opacity .8s cubic-bezier(.16,.8,.24,1), transform .8s cubic-bezier(.16,.8,.24,1)';\n    });\n    const show = (el, d) => setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'none'; }, d);\n    const revealVisible = () => {\n      let d = 0;\n      items.forEach((el) => {\n        if (el.style.opacity === '1') return;\n        const r = el.getBoundingClientRect();\n        if (r.top < (window.innerHeight || 800) * 0.95 && r.bottom > -80) { show(el, d); d += 70; }\n      });\n    };\n    requestAnimationFrame(revealVisible);\n    window.addEventListener('scroll', revealVisible, { passive: true });\n    this._revealVisible = revealVisible;\n    this._safety = setTimeout(() => items.forEach((el) => show(el, 0)), 2500);\n\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((e, i) => {\n        if (!e.isIntersecting) return;\n        const el = e.target;\n        setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'none'; }, i * 70);\n        io.unobserve(el);\n      });\n    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });\n    items.forEach((el) => io.observe(el));\n    this._io = io;\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    if (this._revealVisible) window.removeEventListener('scroll', this._revealVisible);\n    if (this._safety) clearTimeout(this._safety);\n    if (this._io) this._io.disconnect();\n  }\n\n  renderVals() {\n    const phone = (this.props.whatsappNumber ?? '5491100000000').replace(/[^0-9]/g, '');\n    const msg = encodeURIComponent('Hola Marcela, quisiera hacerte una consulta.');\n    const faqData = [\n      { q: '¿Cómo es la primera consulta?', a: 'Charlamos sobre tu situación, te hago las preguntas necesarias y te explico en palabras simples qué opciones tenés, con tiempos estimados y qué implica cada camino. Salís sabiendo qué se puede hacer.' },\n      { q: '¿Atendés de manera virtual?', a: 'Sí. Trabajo con consultas por videollamada y también presenciales en CABA y en la Provincia de Buenos Aires (San Martín, Quilmes y La Matanza), siempre con turno previo.' },\n      { q: '¿Qué necesito llevar o tener a mano?', a: 'Con tu DNI y cualquier documentación vinculada al tema (recibos de sueldo, telegramas, contratos, escrituras, comprobantes o intercambios de mensajes) alcanza para empezar. Si no tenés nada, igual podemos avanzar.' },\n      { q: '¿Cómo se acuerdan los honorarios?', a: 'Antes de iniciar cualquier gestión te informo por escrito cómo se calculan los honorarios y qué gastos puede tener el trámite. Sin sorpresas ni costos que aparezcan después.' },\n      { q: '¿Trabajás con empresas y pymes?', a: 'Sí. Asesoro a empleadores en relaciones laborales, documentación del personal, desvinculaciones y prevención de conflictos, además de temas de consumo vinculados a su actividad.' },\n      { q: '¿Cuánto puede demorar mi caso?', a: 'Depende del tema y de la vía que elijamos. Muchos conflictos se resuelven por acuerdo en semanas; otros requieren una instancia judicial más extensa. Te doy una estimación realista desde el inicio.' },\n    ];\n    return {\n      waHref: 'https://wa.me/' + phone + '?text=' + msg,\n      areas: [\n        { title: 'Derecho de Familia', text: 'Divorcios, alimentos, cuidado personal, régimen de comunicación, convenios y uniones convivenciales, con acompañamiento en cada paso.', tag: 'Personas y familias' },\n        { title: 'Sucesiones', text: 'Te guío en todo el proceso sucesorio de forma clara y ordenada: desde la apertura hasta la inscripción de los bienes.', tag: 'Patrimonio familiar' },\n        { title: 'Derecho Laboral', text: 'Despidos, liquidaciones, registración deficiente y reclamos. Asesoro tanto a trabajadores como a empleadores.', tag: 'Trabajo' },\n        { title: 'Derecho del Consumidor', text: 'Reclamos por productos y servicios, cobros indebidos, planes de ahorro, bancos y coberturas médicas.', tag: 'Consumo' },\n      ],\n      pillars: [\n        { num: '01', text: 'Escucha activa antes de opinar' },\n        { num: '02', text: 'Explicaciones sin tecnicismos' },\n        { num: '03', text: 'Compromiso en cada etapa' },\n      ],\n      problems: [\n        { n: '—', text: 'Me separé y no sé cómo organizar lo económico ni el cuidado de mis hijos.' },\n        { n: '—', text: 'Falleció un familiar y no entiendo qué trámite tengo que iniciar.' },\n        { n: '—', text: 'Me despidieron y no sé si lo que me ofrecen es lo que me corresponde.' },\n        { n: '—', text: 'Trabajo sin estar registrado como corresponde y no sé qué puedo reclamar.' },\n        { n: '—', text: 'Pagué un producto o servicio que nunca me entregaron y no me responden.' },\n        { n: '—', text: 'Tengo una pyme y necesito ordenar la relación con mi personal.' },\n      ],\n      steps: [\n        { n: '1', title: 'Me contás tu situación', text: 'Podés escribirme por WhatsApp o completar el formulario. Leo tu caso antes de responderte.' },\n        { n: '2', title: 'Analizo tu caso', text: 'Reviso la documentación y te doy una primera orientación clara sobre dónde estás parada/o.' },\n        { n: '3', title: 'Definimos la estrategia', text: 'Evaluamos juntas/os las opciones posibles, con tiempos y costos, y elegís con información real.' },\n        { n: '4', title: 'Te acompaño', text: 'Llevo adelante el proceso con seguimiento y te aviso cada novedad, sin que tengas que perseguirme.' },\n      ],\n      care: [\n        'Respondo tus dudas cuantas veces lo necesites.',\n        'Te digo también lo que no conviene hacer.',\n        'Priorizo los acuerdos cuando son el mejor camino.',\n        'Trato reservado y respetuoso de tu historia.',\n      ],\n      faqs: faqData.map((f, i) => {\n        this._refs = this._refs || [];\n        this._refs[i] = this._refs[i] || { panel: React.createRef(), icon: React.createRef() };\n        return {\n          q: f.q,\n          a: f.a,\n          panelRef: this._refs[i].panel,\n          iconRef: this._refs[i].icon,\n          toggle: () => {\n            this._open = this._open === i ? -1 : i;\n            this.paintFaq();\n          },\n        };\n      }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
